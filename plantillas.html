<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantillas · Club Baloncesto O Grove</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== FONDO CON ESCUDO (como bases-legales) ===== */
        body {
            background: linear-gradient(145deg, #f8f9fc 0%, #eef2f7 100%);
            min-height: 100vh;
            position: relative;
        }

        /* ===== ESCUDO DE FONDO ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('assets/img/logos/club/logo-negro.png');
            background-size: auto 70%;
            background-repeat: no-repeat;
            background-position: center center;
            opacity: 0.06;
            transform: rotate(0deg);
            z-index: 0;
            pointer-events: none;
        }

        /* ===== TODO EL CONTENIDO POR ENCIMA DEL FONDO ===== */
        .main-content {
            position: relative;
            z-index: 1;
        }

        /* ===== SELECTOR DE EQUIPO ===== */
        .team-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .team-btn {
            padding: 0.8rem 2.5rem;
            border: 3px solid var(--azul-club);
            border-radius: 50px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            color: var(--azul-club);
            font-family: var(--font-titulos);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .team-btn:hover {
            background: var(--azul-club);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.3);
        }
        .team-btn.active {
            background: var(--azul-club);
            color: white;
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.3);
        }
        .team-btn .badge {
            display: inline-block;
            background: var(--dorado);
            color: var(--azul-club);
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 0.3rem;
        }

        /* ===== CONTENEDOR DE PLANTILLAS ===== */
        .team-container { display: none; }
        .team-container.active { display: block; }

        /* ===== SECCIÓN DE EQUIPO (sin recuadro blanco) ===== */
        .team-section {
            margin-bottom: 2rem;
        }
        .team-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            padding: 0.8rem 1.5rem;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .team-section-header h2 {
            font-size: 1.8rem;
            color: var(--azul-club);
            font-family: var(--font-titulos);
        }
        .team-section-header .count {
            background: var(--azul-club);
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
        }

        /* ===== GRILLA DE JUGADORES (5 columnas) ===== */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2rem;
            justify-items: center;
            justify-content: center;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ===== STAFF EN HORIZONTAL (entrenadores izq, delegados der) ===== */
        .staff-row {
            display: flex;
            justify-content: center;
            gap: 4rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px dashed var(--dorado);
            flex-wrap: wrap;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border-radius: 15px;
            padding: 1.5rem 2rem;
        }

        .staff-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .staff-group-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--azul-club);
            font-weight: 600;
            opacity: 0.7;
            border-bottom: 2px solid var(--dorado);
            padding-bottom: 0.3rem;
            margin-bottom: 0.5rem;
        }

        .staff-group-cards {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ===== FICHA DE JUGADOR - DISEÑO EXACTO ===== */
        .player-card {
            width: 233px;
            height: 350px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #000000;
            background: #FFD700;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            flex-shrink: 0;
        }
        .player-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        /* ===== FICHA INVERTIDA (STAFF) ===== */
        .player-card.invertido {
            background: #000000;
            border: 3px solid #FFD700;
        }
        .player-card.invertido .card-background {
            filter: brightness(1) invert(1) contrast(1);
        }
        .player-card.invertido .photo-container {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.2);
        }
        .player-card.invertido .player-number {
            background: #FFD700;
            color: #000000;
            border: 2px solid #FFD700;
            box-shadow: 0 3px 6px rgba(255, 215, 0, 0.3);
        }
        .player-card.invertido .name-container {
            background: #FFD700;
            border: 1.5px solid #FFD700;
        }
        .player-card.invertido .player-name {
            color: #000000;
        }
        .player-card.invertido .photo-error {
            color: white !important;
            background: rgba(0, 0, 0, 0.3) !important;
        }

        /* ===== ELEMENTOS INTERNOS ===== */
        .card-background {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            opacity: 0.15;
            transform: rotate(35deg);
            background-image: url('assets/img/logos/club/logo-negro.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: brightness(0) contrast(1);
            pointer-events: none;
        }

        .photo-container {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 80px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.1);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-error {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #000000;
            background: rgba(255, 215, 0, 0.3);
        }

        /* ===== NÚMERO ===== */
        .player-number {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            border: 2px solid #000000;
            background: #000000;
            color: #FFD700;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            z-index: 3;
        }

        /* ===== NOMBRE ===== */
        .name-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 55px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            background: #000000;
            border: 1.5px solid #000000;
            z-index: 2;
        }

        .player-name {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            color: #FFD700;
            letter-spacing: 0.8px;
            line-height: 1.1;
        }

        /* ===== TÍTULO DE PÁGINA ===== */
        .page-title {
            text-align: center;
            color: var(--azul-club);
            font-family: var(--font-titulos);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.8);
        }
        .page-subtitle {
            text-align: center;
            color: var(--gris-texto);
            margin-bottom: 2rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .players-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 992px) {
            .players-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            .players-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            .player-card {
                width: 180px;
                height: 270px;
            }
            .photo-container {
                top: 18px;
                left: 18px;
                right: 18px;
                bottom: 62px;
            }
            .player-number {
                width: 42px;
                height: 42px;
                font-size: 20px;
                top: 10px;
                left: 10px;
            }
            .name-container {
                height: 42px;
                bottom: 10px;
                left: 10px;
                right: 10px;
            }
            .player-name {
                font-size: 16px;
                letter-spacing: 0.5px;
            }
            .team-section-header h2 { font-size: 1.3rem; }
            .team-btn {
                padding: 0.5rem 1.5rem;
                font-size: 0.9rem;
            }
            .staff-row {
                flex-direction: column;
                gap: 1.5rem;
                align-items: center;
            }
            .staff-group-cards {
                gap: 1rem;
            }
        }
        @media (max-width: 480px) {
            .players-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
            .player-card {
                width: 150px;
                height: 225px;
            }
            .photo-container {
                top: 14px;
                left: 14px;
                right: 14px;
                bottom: 50px;
            }
            .player-number {
                width: 35px;
                height: 35px;
                font-size: 16px;
                top: 8px;
                left: 8px;
            }
            .name-container {
                height: 36px;
                bottom: 8px;
                left: 8px;
                right: 8px;
                padding: 2px 4px;
            }
            .player-name {
                font-size: 13px;
                letter-spacing: 0.3px;
            }
            .staff-row {
                gap: 1rem;
                padding: 1rem;
            }
            .staff-group-cards {
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="main-header">
        <a href="/" class="logo">
            <img src="assets/img/logos/club/logo-dorado.png" alt="CB O Grove" onerror="this.style.display='none'">
            CB O GROVE
        </a>
        <nav class="main-nav">
            <a href="/">Inicio</a>
            <a href="plantillas.html" class="active">Plantillas</a>
            <a href="jornadas.html">Jornadas</a>
            <a href="noticias.html">Noticias</a>
            <a href="sorteos.html">Sorteos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <span class="twitch-badge" id="twitchBadge">📺 No en directo</span>
    </header>

    <!-- ===== CONTENIDO ===== -->
    <main class="main-content">
        <h1 class="page-title">👥 NOSAS PLANTILLAS</h1>
        <p class="page-subtitle">Coñece a todos os xogadores e xogadoras do club</p>

        <!-- SELECTOR -->
        <div class="team-selector">
            <button class="team-btn active" data-team="femenino" onclick="mostrarEquipo('femenino')">
                ⚪ Femenino <span class="badge" id="countF">0</span>
            </button>
            <button class="team-btn" data-team="masculino" onclick="mostrarEquipo('masculino')">
                ⚫ Masculino <span class="badge" id="countM">0</span>
            </button>
        </div>

        <!-- EQUIPO FEMENINO -->
        <div class="team-container active" id="equipo-femenino">
            <div class="team-section">
                <div class="team-section-header">
                    <h2>⚪ Femenino</h2>
                    <span class="count" id="countFemenino">Cargando...</span>
                </div>
                <div class="players-grid" id="gridFemenino">
                    <p style="grid-column:1/-1; text-align:center; color:var(--gris-texto);">Cargando xogadoras...</p>
                </div>
            </div>
        </div>

        <!-- EQUIPO MASCULINO -->
        <div class="team-container" id="equipo-masculino">
            <div class="team-section">
                <div class="team-section-header">
                    <h2>⚫ Masculino</h2>
                    <span class="count" id="countMasculino">Cargando...</span>
                </div>
                <div class="players-grid" id="gridMasculino">
                    <p style="grid-column:1/-1; text-align:center; color:var(--gris-texto);">Cargando xogadores...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer">
        <div class="redes">
            <a href="https://www.tiktok.com/@cbogrove" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@cbogrove" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.instagram.com/cbogrove" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.twitch.tv/cbogrove" target="_blank"><i class="fab fa-twitch"></i></a>
            <a href="https://x.com/cbogrove" target="_blank"><i class="fab fa-twitter"></i></a>
        </div>
        <div class="copy">© 2026 Club Baloncesto O Grove</div>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/app.js"></script>
    <script>
        // ===== CONFIGURACIÓN =====
        const CONFIG_PLANTILLAS = {
            sheetFemenino: 'https://docs.google.com/spreadsheets/d/1HyII2lYStJ8AdgL1vjWPc7N9S_4r4eCHKH-4WMLHD24/export?format=csv&gid=0',
            sheetMasculino: 'https://docs.google.com/spreadsheets/d/1HyII2lYStJ8AdgL1vjWPc7N9S_4r4eCHKH-4WMLHD24/export?format=csv&gid=1375196205',
            driveFemenino: 'assets/img/plantillas/femenino/',
            driveMasculino: 'assets/img/plantillas/masculino/'
        };

        // ===== FUNCIONES =====
        function mostrarEquipo(equipo) {
            document.querySelectorAll('.team-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.team === equipo);
            });
            document.querySelectorAll('.team-container').forEach(el => {
                el.classList.toggle('active', el.id === `equipo-${equipo}`);
            });
        }

        function esStaff(valor) {
            if (!valor) return false;
            const v = String(valor).toUpperCase().trim();
            return v === 'SI' || v === 'SÍ' || v === 'TRUE' || v === '1';
        }

        function crearFicha(jugador, equipo) {
            const esStaffMiembro = esStaff(jugador.entrenador);
            
            const driveBase = equipo === 'femenino' ? CONFIG_PLANTILLAS.driveFemenino : CONFIG_PLANTILLAS.driveMasculino;
            const timestamp = Date.now();
            const fotoUrl = `${driveBase}${jugador.numero}.png?t=${timestamp}`;
            
            let numDisplay = String(jugador.numero || '?');
            if (numDisplay.startsWith('E')) numDisplay = 'E';
            if (numDisplay.startsWith('D')) numDisplay = 'D';

            const card = document.createElement('div');
            card.className = `player-card${esStaffMiembro ? ' invertido' : ''}`;

            const logoFondo = 'assets/img/logos/club/logo-negro.png';

            card.innerHTML = `
                <div class="card-background" style="background-image: url('${logoFondo}?t=${timestamp}');"></div>
                <div class="player-number">${numDisplay}</div>
                <div class="photo-container">
                    <img src="${fotoUrl}"
                         alt="${jugador.nombre || 'Jugador'}"
                         loading="lazy"
                         onerror="this.parentElement.innerHTML='<div class=\\'photo-error\\'>${numDisplay}</div>'">
                </div>
                <div class="name-container">
                    <div class="player-name">${jugador.nombre || 'Sin nombre'}</div>
                </div>
            `;

            return card;
        }

        function parseCSV(csv) {
            const lines = csv.split('\n').filter(line => line.trim());
            if (lines.length < 2) return [];

            const rawHeaders = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            const headerMap = {};
            rawHeaders.forEach((h, index) => {
                if (h.includes('numero') || h.includes('dorsal') || h.includes('número')) {
                    headerMap['numero'] = index;
                } else if (h.includes('nombre') || h.includes('nome') || h.includes('jugador')) {
                    headerMap['nombre'] = index;
                } else if (h.includes('entrenador') || h.includes('staff') || h.includes('tecnico')) {
                    headerMap['entrenador'] = index;
                }
            });

            if (headerMap['numero'] === undefined) headerMap['numero'] = 0;
            if (headerMap['nombre'] === undefined) headerMap['nombre'] = 1;
            if (headerMap['entrenador'] === undefined) headerMap['entrenador'] = 2;

            return lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                const obj = {};
                Object.keys(headerMap).forEach(key => {
                    obj[key] = values[headerMap[key]] || '';
                });
                return obj;
            });
        }

        async function cargarHoja(url, equipo, gridId, countId) {
            try {
                console.log(`🔄 Cargando ${equipo} desde:`, url);
                const response = await fetch(url);
                const csv = await response.text();
                console.log(`📄 CSV recibido (primeros 200 caracteres):`, csv.substring(0, 200));
                
                const datos = parseCSV(csv);
                console.log(`📊 Datos parseados (${datos.length} filas):`, datos);

                // Separar jugadores de staff
                const staff = datos.filter(j => esStaff(j.entrenador));
                const jugadores = datos.filter(j => !esStaff(j.entrenador));

                console.log(`👥 Jugadores: ${jugadores.length}, Staff: ${staff.length}`);

                // Ordenar jugadores por número
                jugadores.sort((a, b) => {
                    const numA = parseInt(a.numero);
                    const numB = parseInt(b.numero);
                    if (isNaN(numA)) return 1;
                    if (isNaN(numB)) return -1;
                    return numA - numB;
                });

                // Separar staff en entrenadores (E) y delegados (D)
                const entrenadores = staff.filter(j => j.numero.startsWith('E'));
                const delegados = staff.filter(j => j.numero.startsWith('D'));

                // Ordenar entrenadores: E1 → E2
                entrenadores.sort((a, b) => {
                    const indexA = parseInt(a.numero.replace('E', '') || 0);
                    const indexB = parseInt(b.numero.replace('E', '') || 0);
                    return indexA - indexB;
                });

                // Ordenar delegados: D1 → D2
                delegados.sort((a, b) => {
                    const indexA = parseInt(a.numero.replace('D', '') || 0);
                    const indexB = parseInt(b.numero.replace('D', '') || 0);
                    return indexA - indexB;
                });

                const grid = document.getElementById(gridId);
                grid.innerHTML = '';

                // Renderizar jugadores
                jugadores.forEach(j => grid.appendChild(crearFicha(j, equipo)));

                // ===== STAFF EN FILA HORIZONTAL =====
                if (entrenadores.length > 0 || delegados.length > 0) {
                    const staffRow = document.createElement('div');
                    staffRow.className = 'staff-row';

                    // Entrenadores (izquierda)
                    if (entrenadores.length > 0) {
                        const group = document.createElement('div');
                        group.className = 'staff-group';
                        group.innerHTML = `<div class="staff-group-label">🧑‍🏫 Entrenadores</div>`;
                        const cards = document.createElement('div');
                        cards.className = 'staff-group-cards';
                        entrenadores.forEach(j => cards.appendChild(crearFicha(j, equipo)));
                        group.appendChild(cards);
                        staffRow.appendChild(group);
                    }

                    // Delegados (derecha)
                    if (delegados.length > 0) {
                        const group = document.createElement('div');
                        group.className = 'staff-group';
                        group.innerHTML = `<div class="staff-group-label">📋 Delegados</div>`;
                        const cards = document.createElement('div');
                        cards.className = 'staff-group-cards';
                        delegados.forEach(j => cards.appendChild(crearFicha(j, equipo)));
                        group.appendChild(cards);
                        staffRow.appendChild(group);
                    }

                    // Insertar DESPUÉS del grid
                    grid.parentNode.insertBefore(staffRow, grid.nextSibling);
                }

                const countEl = document.getElementById(countId);
                if (countEl) countEl.textContent = `${datos.length} ${equipo === 'femenino' ? 'xogadoras' : 'xogadores'}`;

                const badgeId = equipo === 'femenino' ? 'countF' : 'countM';
                document.getElementById(badgeId).textContent = datos.length;

                return datos.length;

            } catch (error) {
                console.error(`Error cargando ${equipo}:`, error);
                document.getElementById(gridId).innerHTML =
                    `<p style="grid-column:1/-1; text-align:center; color:#e74c3c;">⚠️ Erro cargando os datos. Reintentando...</p>`;
                setTimeout(() => cargarHoja(url, equipo, gridId, countId), 5000);
                return 0;
            }
        }

        async function cargarPlantillas() {
            const totalF = await cargarHoja(CONFIG_PLANTILLAS.sheetFemenino, 'femenino', 'gridFemenino', 'countFemenino');
            const totalM = await cargarHoja(CONFIG_PLANTILLAS.sheetMasculino, 'masculino', 'gridMasculino', 'countMasculino');
            console.log(`✅ Plantillas cargadas: ${totalF} femenino, ${totalM} masculino`);
        }

        document.addEventListener('DOMContentLoaded', cargarPlantillas);
    </script>
</body>
</html>
