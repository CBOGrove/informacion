<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrocinadores · Club Baloncesto O Grove</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="js/config.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/app.js" defer></script>
    
    <script defer>
        document.addEventListener('DOMContentLoaded', function() {
            cargarPatrocinadores();
        });

        function formatearTextoConSaltos(texto) {
            if (!texto) return '';
            const lineas = texto.split('|').map(line => line.trim());
            return lineas.map(line => `<span class="linea">${line}</span>`).join('');
        }

        function crearTarjetaPatrocinador(patrocinador) {
            const container = document.createElement('div');
            container.className = 'patrocinador-card';

            const logoUrl = patrocinador.logo ? convertirURLImagen(patrocinador.logo) : '';
            const nombre = patrocinador.nombre || 'Sen nome';
            const descripcion = patrocinador.descripcion || '';
            const telefono = patrocinador.telefono || '';
            const mapsUrl = patrocinador.maps || '';

            const descripcionHTML = formatearTextoConSaltos(descripcion);

            let html = `
                <div class="logo-container">
                    <img src="${logoUrl}" alt="${nombre}" loading="lazy" onerror="this.style.display='none'">
                </div>
                <div class="nombre">${nombre}</div>
                <div class="descripcion">${descripcionHTML}</div>
                <div class="info-extra">
            `;

            if (telefono) {
                html += `
                    <div class="telefono">
                        <i class="fas fa-phone"></i>
                        <span>${telefono}</span>
                    </div>
                `;
            }

            if (mapsUrl) {
                html += `
                    <a href="${mapsUrl}" target="_blank" rel="noopener" class="maps-link">
                        <i class="fas fa-map-marker-alt"></i>
                        Ver localización
                    </a>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
            return container;
        }

        function crearTarjetaAnunciate() {
            const container = document.createElement('div');
            container.className = 'patrocinador-card anunciate';
            
            container.innerHTML = `
                <div class="icono-anuncio">📢</div>
                <div class="titulo-anuncio">Anúnciese aquí</div>
                <div class="texto-anuncio">
                    Apoia ao Club Baloncesto O Grove<br>
                    e dá visibilidade á túa empresa
                </div>
                <a href="contacto.html" class="btn-contacto">
                    <i class="fas fa-envelope"></i> Contactar
                </a>
            `;

            return container;
        }

        async function cargarPatrocinadores() {
            const grid = document.getElementById('patrocinadoresGrid');
            if (!grid) return;

            try {
                console.log('🔄 Cargando patrocinadores...');
                const response = await fetch(CONFIG.sheets.patrocinadores);
                const csv = await response.text();
                const patrocinadores = parseCSVPatrocinadores(csv);

                console.log('📊 Patrocinadores parseados:', patrocinadores);

                const privados = patrocinadores.filter(p => 
                    p.nombre && (!p.tipo || p.tipo.toUpperCase() !== 'SI')
                );

                grid.innerHTML = '';

                if (privados.length > 0) {
                    privados.forEach(p => {
                        grid.appendChild(crearTarjetaPatrocinador(p));
                    });
                }

                grid.appendChild(crearTarjetaAnunciate());

                console.log(`✅ ${privados.length} patrocinadores privados cargados`);

            } catch (error) {
                console.error('Error cargando patrocinadores:', error);
                grid.innerHTML = `
                    <div class="no-patrocinadores" style="color:#e74c3c;">
                        ⚠️ Erro cargando os patrocinadores.
                    </div>
                `;
                setTimeout(() => {
                    grid.innerHTML = '';
                    grid.appendChild(crearTarjetaAnunciate());
                }, 1000);
            }
        }
    </script>
</head>
<body>

    <main class="main-content">
        <h1 class="page-title">🏆 PATROCINADORES</h1>
        <p class="page-subtitle">Empresas e entidades que fan posible o noso club</p>

        <div class="patrocinadores-grid" id="patrocinadoresGrid">
            <div class="spinner-container">
                <div class="spinner"></div>
                <p style="color: var(--gris-texto);">Cargando patrocinadores...</p>
            </div>
        </div>
    </main>

</body>
</html>
