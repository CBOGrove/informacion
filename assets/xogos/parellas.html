<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As parellas · CB O Grove</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* ============================================
           ESTILOS COPIADOS DE ALIÑA O EQUIPO
           (Solo lo necesario para este juego)
           ============================================ */
        
        .game-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            padding: 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 0 0 15px 15px;
            position: relative;
            z-index: 1;
        }

        /* ===== SELECTOR DE CONFIGURACIÓN ===== */
        .setup-panel {
            background: rgba(30, 58, 95, 0.05);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(201, 160, 61, 0.15);
            text-align: center;
        }
        
        .setup-title {
            font-family: var(--font-titulos);
            font-size: 2rem;
            color: var(--azul-club);
            margin-bottom: 1.2rem;
        }
        
        .setup-row {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        
        .setup-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            min-width: 100px;
        }
        
        .setup-group-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gris-texto);
            font-weight: 600;
        }
        
        .setup-group-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .setup-btn {
            padding: 0.4rem 1rem;
            border: 2px solid var(--azul-club);
            border-radius: 30px;
            background: rgba(255,255,255,0.6);
            color: var(--azul-club);
            font-family: var(--font-titulos);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .setup-btn:hover {
            background: var(--azul-club);
            color: white;
            transform: translateY(-2px);
        }
        
        .setup-btn.active {
            background: var(--azul-club);
            color: white;
        }
        
        .start-btn {
            background: var(--azul-club);
            color: white;
            font-size: 1.2rem;
            padding: 0.7rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-family: var(--font-titulos);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(30, 58, 95, 0.3);
            margin-top: 0.3rem;
        }
        
        .start-btn:hover {
            background: var(--dorado);
            color: var(--azul-club);
            transform: translateY(-3px);
        }

        /* ===== TABLERO DE CARTAS ===== */
        .board {
            display: flex;
            justify-content: center;
            margin: 1.2rem 0;
            min-height: 300px;
        }
        
        .cards-grid {
            display: grid;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        /* ===== CARTA (idéntica a Aliña o equipo) ===== */
        .card {
            aspect-ratio: 2 / 3;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
            transform-style: preserve-3d;
            max-width: 130px;
            min-width: 65px;
            margin: 0 auto;
        }
        
        .card:hover:not(.flipped):not(.disabled) {
            transform: scale(1.04);
        }
        
        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            padding: 6px;
            border: 3px solid #000000;
        }
        
        /* REVERSO */
        .card-back {
            background: #FFD700;
            transform: rotateY(0deg);
            border-color: #000000;
        }
        
        .card-back img {
            width: 75%;
            height: 75%;
            object-fit: contain;
        }
        
        .card-back .fallback {
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            font-family: var(--font-titulos);
        }
        
        /* ANVERSO */
        .card-front {
            background: #f5f5f5;
            transform: rotateY(180deg);
            border-color: #000000;
            flex-direction: column;
            padding: 8px;
        }
        
        .card-front .card-foto {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
        }
        
        .card-front .card-foto-placeholder {
            width: 100%;
            height: 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: rgba(30, 58, 95, 0.05);
            border-radius: 6px;
            color: var(--gris-texto);
        }
        
        .card-front .card-info {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--azul-club);
            text-align: center;
            padding: 4px 0;
            line-height: 1.2;
            font-family: var(--font-titulos);
            width: 100%;
        }
        
        .card-front .card-info .dorsal {
            display: inline-block;
            background: var(--azul-club);
            color: white;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            margin-left: 4px;
        }
        
        .card.flipped .card-back {
            transform: rotateY(180deg);
        }
        
        .card.flipped .card-front {
            transform: rotateY(0deg);
        }
        
        .card.disabled {
            pointer-events: none;
            opacity: 0.5;
        }

        /* ===== ESTADO ===== */
        .status-area {
            margin: 1rem 0 0.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--azul-club);
            min-height: 50px;
            font-family: var(--font-titulos);
            text-align: center;
        }
        
        .status-area .victory {
            background: var(--dorado);
            color: var(--azul-club);
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 50px;
        }

        /* ===== BOTONES ===== */
        .info-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .info-buttons button {
            padding: 0.5rem 1.5rem;
            font-family: var(--font-titulos);
            font-size: 0.9rem;
            font-weight: 600;
            background: var(--azul-club);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .info-buttons button:hover {
            background: var(--dorado);
            color: var(--azul-club);
            transform: translateY(-2px);
        }
        
        .info-buttons button.help-btn {
            background: #6c757d;
        }
        
        .info-buttons button.help-btn:hover {
            background: #5a6268;
            color: white;
        }
        
        .info-buttons .shortcut {
            font-size: 0.6rem;
            opacity: 0.6;
            display: block;
        }

        .loading-text {
            text-align: center;
            color: var(--gris-texto);
            padding: 2rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .game-wrapper { padding: 1rem; }
            .setup-panel { padding: 1rem; }
            .setup-title { font-size: 1.5rem; }
            .setup-row { gap: 0.8rem; }
            .setup-group { min-width: 80px; }
            .setup-btn { font-size: 0.7rem; padding: 0.3rem 0.7rem; }
            .start-btn { font-size: 1rem; padding: 0.5rem 1.5rem; }
            .cards-grid { gap: 10px; }
            .card { min-width: 55px; max-width: 95px; }
            .card-front .card-info { font-size: 0.65rem; }
            .status-area { font-size: 1rem; }
        }
        
        @media (max-width: 480px) {
            .card { min-width: 50px; max-width: 75px; }
            .cards-grid { gap: 8px; }
            .card-front .card-info { font-size: 0.55rem; }
            .status-area { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER INYECTADO POR LAYOUT.JS ===== -->

    <div class="main-content">
        <div class="game-wrapper">

            <!-- ===== SETUP ===== -->
            <div id="setupPanel" class="setup-panel">
                <div class="setup-title">🏀 AS PARELLAS</div>
                
                <div class="setup-row">
                    <div class="setup-group">
                        <span class="setup-group-label">🎯 Dificultade</span>
                        <div class="setup-group-buttons" id="difficultySelector">
                            <button data-diff="easy" class="setup-btn active">Fácil</button>
                            <button data-diff="medium" class="setup-btn">Medio</button>
                        </div>
                    </div>
                </div>
                
                <div class="setup-row">
                    <div class="setup-group">
                        <span class="setup-group-label">🔢 Parellas</span>
                        <div class="setup-group-buttons" id="pairSelector">
                            <button data-pairs="4" class="setup-btn">4</button>
                            <button data-pairs="6" class="setup-btn active">6</button>
                            <button data-pairs="8" class="setup-btn">8</button>
                            <button data-pairs="10" class="setup-btn">10</button>
                        </div>
                    </div>
                    
                    <div class="setup-group">
                        <span class="setup-group-label">👥 Equipo</span>
                        <div class="setup-group-buttons" id="teamSelector">
                            <button data-team="femenino" class="setup-btn active">Femenino</button>
                            <button data-team="masculino" class="setup-btn">Masculino</button>
                        </div>
                    </div>
                </div>
                
                <button id="startGameBtn" class="start-btn">🎮 INICIAR PARTIDA</button>
                <div style="margin-top:6px; font-size:0.7rem; color:var(--gris-texto); opacity:0.6;">
                    Fácil: foto ↔ foto | Medio: foto ↔ nome + dorsal
                </div>
            </div>

            <!-- ===== XOGO ===== -->
            <div id="gameArea" style="display:none;">
                <div class="board">
                    <div id="cardsGrid" class="cards-grid">
                        <div class="loading-text">Cargando xogadores...</div>
                    </div>
                </div>
                
                <div class="status-area" id="statusMessage">🔄 Atopa as parellas</div>
                
                <div class="info-buttons">
                    <button id="newGameBtn">🔄 Nova partida <span class="shortcut">(N)</span></button>
                    <button id="helpBtn" class="help-btn">❓ Axuda <span class="shortcut">(H)</span></button>
                </div>
            </div>

        </div>
    </div>

    <!-- ===== FOOTER INYECTADO POR LAYOUT.JS ===== -->

    <script>
        // =============================================
        // AS PARELLAS - LÓXICA
        // =============================================

        (function() {
            'use strict';

            // ===== CONFIG =====
            const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1HyII2lYStJ8AdgL1vjWPc7N9S_4r4eCHKH-4WMLHD24/export?format=csv';
            const DRIVE = {
                femenino: 'assets/img/plantillas/femenino/',
                masculino: 'assets/img/plantillas/masculino/'
            };

            // ===== ESTADO =====
            let state = {
                team: 'femenino',
                difficulty: 'easy',
                pairs: 6,
                players: [],
                cards: [],
                selected1: null,
                selected2: null,
                locked: false,
                active: false,
                matched: 0,
                total: 0
            };

            // ===== DOM =====
            const setupPanel = document.getElementById('setupPanel');
            const gameArea = document.getElementById('gameArea');
            const cardsGrid = document.getElementById('cardsGrid');
            const statusMsg = document.getElementById('statusMessage');
            const startBtn = document.getElementById('startGameBtn');
            const newBtn = document.getElementById('newGameBtn');
            const helpBtn = document.getElementById('helpBtn');

            // ===== UTILS =====
            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function parseCSVLine(line) {
                const vals = [];
                let cur = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const c = line[i];
                    if (c === '"') { inQuotes = !inQuotes; continue; }
                    if (c === ',' && !inQuotes) { vals.push(cur.trim()); cur = ''; continue; }
                    cur += c;
                }
                vals.push(cur.trim());
                return vals;
            }

            function parsePlayers(csv) {
                const lines = csv.split('\n').filter(l => l.trim());
                if (lines.length < 2) return [];
                const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                const idxNum = headers.findIndex(h => h.includes('numero') || h.includes('dorsal'));
                const idxNom = headers.findIndex(h => h.includes('nombre') || h.includes('nome'));
                const idxStaff = headers.findIndex(h => h.includes('entrenador') || h.includes('staff'));
                const result = [];
                for (let i = 1; i < lines.length; i++) {
                    const vals = parseCSVLine(lines[i]);
                    const num = (vals[idxNum] || '').trim();
                    const nom = (vals[idxNom] || '').trim();
                    const staff = (vals[idxStaff] || '').trim();
                    if (num && nom && !['SI', 'SÍ', 'TRUE', '1'].includes(staff.toUpperCase())) {
                        result.push({ numero: num, nombre: nom, dorsal: parseInt(num) || 0 });
                    }
                }
                return result;
            }

            function getLayout(total) {
                if (total <= 8) return { cols: 4 };
                if (total <= 12) return { cols: 4 };
                if (total <= 16) return { cols: 4 };
                return { cols: 5 };
            }

            // ===== CARGA =====
            async function loadPlayers(team) {
                try {
                    const gid = team === 'femenino' ? '0' : '1375196205';
                    const url = SHEET_URL + '&gid=' + gid;
                    const resp = await fetch(url);
                    const csv = await resp.text();
                    return parsePlayers(csv);
                } catch (e) {
                    console.error(e);
                    return [];
                }
            }

            // ===== GENERAR CARTAS =====
            function generateCards(players, numPairs, difficulty, team) {
                const selected = shuffle(players).slice(0, numPairs);
                const base = DRIVE[team];
                let cards = [];
                selected.forEach((p, idx) => {
                    const foto = base + p.numero + '.png';
                    if (difficulty === 'easy') {
                        cards.push({ id: 'a' + idx, pair: idx, type: 'foto', value: foto, name: p.nombre, dorsal: p.dorsal, flipped: false, gone: false });
                        cards.push({ id: 'b' + idx, pair: idx, type: 'foto', value: foto, name: p.nombre, dorsal: p.dorsal, flipped: false, gone: false });
                    } else {
                        cards.push({ id: 'a' + idx, pair: idx, type: 'foto', value: foto, name: p.nombre, dorsal: p.dorsal, flipped: false, gone: false });
                        cards.push({ id: 'b' + idx, pair: idx, type: 'info', value: p.nombre + ' #' + p.dorsal, name: p.nombre, dorsal: p.dorsal, flipped: false, gone: false });
                    }
                });
                return shuffle(cards);
            }

            // ===== RENDER =====
            function render(cards) {
                cardsGrid.innerHTML = '';
                const total = cards.length;
                const layout = getLayout(total);
                cardsGrid.style.gridTemplateColumns = 'repeat(' + layout.cols + ', minmax(60px, 120px))';
                cardsGrid.style.gap = '12px';

                cards.forEach((c, idx) => {
                    const el = document.createElement('div');
                    el.className = 'card';
                    if (c.flipped) el.classList.add('flipped');
                    if (c.gone) el.classList.add('disabled');
                    el.dataset.idx = idx;

                    // Reverso
                    const back = document.createElement('div');
                    back.className = 'card-back';
                    const img = document.createElement('img');
                    img.src = 'assets/img/logos/club/logo-negro.png';
                    img.alt = 'Logo';
                    img.onerror = function() { this.parentElement.innerHTML = '<div class="fallback">🏀</div>'; };
                    back.appendChild(img);

                    // Anverso
                    const front = document.createElement('div');
                    front.className = 'card-front';

                    if (c.type === 'foto') {
                        const f = document.createElement('img');
                        f.className = 'card-foto';
                        f.src = c.value;
                        f.alt = c.name;
                        f.loading = 'lazy';
                        f.onerror = function() {
                            this.style.display = 'none';
                            const ph = document.createElement('div');
                            ph.className = 'card-foto-placeholder';
                            ph.textContent = '🏀';
                            this.parentElement.appendChild(ph);
                        };
                        front.appendChild(f);
                        if (state.difficulty === 'easy') {
                            const info = document.createElement('div');
                            info.className = 'card-info';
                            info.textContent = c.name;
                            front.appendChild(info);
                        }
                    } else {
                        const info = document.createElement('div');
                        info.className = 'card-info';
                        info.innerHTML = c.name + ' <span class="dorsal">#' + c.dorsal + '</span>';
                        front.appendChild(info);
                    }

                    el.appendChild(back);
                    el.appendChild(front);

                    el.addEventListener('click', function() {
                        const i = parseInt(this.dataset.idx);
                        handleClick(i);
                    });

                    cardsGrid.appendChild(el);
                    c.el = el;
                });
            }

            function updateCard(idx) {
                const c = state.cards[idx];
                if (!c || !c.el) return;
                c.el.classList.toggle('flipped', c.flipped);
                c.el.classList.toggle('disabled', c.gone);
            }

            // ===== LÓGICA =====
            function handleClick(idx) {
                if (!state.active || state.locked) return;
                const c = state.cards[idx];
                if (c.gone || c.flipped) return;
                if (state.selected1 && state.selected2) return;

                c.flipped = true;
                updateCard(idx);

                if (!state.selected1) {
                    state.selected1 = { idx, pair: c.pair };
                } else if (!state.selected2 && state.selected1.idx !== idx) {
                    state.selected2 = { idx, pair: c.pair };
                    state.locked = true;
                    checkMatch();
                } else if (state.selected1.idx === idx) {
                    c.flipped = false;
                    updateCard(idx);
                    state.selected1 = null;
                }
            }

            function checkMatch() {
                const s1 = state.selected1;
                const s2 = state.selected2;
                if (!s1 || !s2) return;

                if (s1.pair === s2.pair) {
                    statusMsg.textContent = '🎯 ¡CANASTA!';
                    state.matched++;
                    state.cards[s1.idx].gone = true;
                    state.cards[s2.idx].gone = true;
                    updateCard(s1.idx);
                    updateCard(s2.idx);
                    state.selected1 = null;
                    state.selected2 = null;
                    state.locked = false;
                    if (state.matched === state.total) {
                        state.active = false;
                        statusMsg.innerHTML = '<span class="victory">🏆 ¡VITORIA! 🏆</span>';
                    }
                } else {
                    statusMsg.textContent = '❌ Fallo...';
                    setTimeout(() => {
                        if (!state.active) return;
                        const c1 = state.cards[s1.idx];
                        const c2 = state.cards[s2.idx];
                        if (c1 && !c1.gone) { c1.flipped = false;
                            updateCard(s1.idx); }
                        if (c2 && !c2.gone) { c2.flipped = false;
                            updateCard(s2.idx); }
                        state.selected1 = null;
                        state.selected2 = null;
                        state.locked = false;
                        statusMsg.textContent = '🔍 Sigue buscando...';
                    }, 800);
                }
            }

            // ===== AYUDA =====
            function showHelp() {
                if (!state.active || state.locked) return;
                const avail = state.cards.filter((c, i) => !c.gone && !c.flipped);
                if (avail.length < 2) { statusMsg.textContent = '⚠️ Non hai cartas ocultas'; return; }
                const idx1 = state.cards.indexOf(avail[Math.floor(Math.random() * avail.length)]);
                let idx2 = state.cards.indexOf(avail[Math.floor(Math.random() * avail.length)]);
                while (idx2 === idx1 && avail.length > 1) {
                    idx2 = state.cards.indexOf(avail[Math.floor(Math.random() * avail.length)]);
                }
                state.cards[idx1].flipped = true;
                state.cards[idx2].flipped = true;
                updateCard(idx1);
                updateCard(idx2);
                statusMsg.textContent = '💡 Mostrando 2 cartas...';
                state.locked = true;
                setTimeout(() => {
                    if (!state.active) return;
                    if (!state.cards[idx1].gone) { state.cards[idx1].flipped = false;
                        updateCard(idx1); }
                    if (!state.cards[idx2].gone) { state.cards[idx2].flipped = false;
                        updateCard(idx2); }
                    state.locked = false;
                    statusMsg.textContent = '🔍 Continúa...';
                    state.selected1 = null;
                    state.selected2 = null;
                }, 1000);
            }

            // ===== INICIAR =====
            async function startGame() {
                const players = await loadPlayers(state.team);
                if (players.length < state.pairs) {
                    statusMsg.textContent = '⚠️ Non hai suficientes xogadores (' + players.length + ' dispoñibles)';
                    return;
                }
                state.players = players;
                state.total = state.pairs;
                state.matched = 0;
                state.cards = generateCards(players, state.pairs, state.difficulty, state.team);
                render(state.cards);
                state.selected1 = null;
                state.selected2 = null;
                state.locked = false;
                state.active = true;
                setupPanel.style.display = 'none';
                gameArea.style.display = 'block';
                statusMsg.textContent = '🎲 Atopa as parellas! (H para axuda)';
            }

            function resetGame() {
                setupPanel.style.display = 'block';
                gameArea.style.display = 'none';
                state.active = false;
                state.cards = [];
                cardsGrid.innerHTML = '';
                statusMsg.textContent = '🔄 Nova partida';
            }

            // ===== EVENTOS =====
            document.querySelectorAll('#difficultySelector .setup-btn').forEach(b => {
                b.addEventListener('click', function() {
                    document.querySelectorAll('#difficultySelector .setup-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    state.difficulty = this.dataset.diff;
                });
            });

            document.querySelectorAll('#pairSelector .setup-btn').forEach(b => {
                b.addEventListener('click', function() {
                    document.querySelectorAll('#pairSelector .setup-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    state.pairs = parseInt(this.dataset.pairs);
                });
            });

            document.querySelectorAll('#teamSelector .setup-btn').forEach(b => {
                b.addEventListener('click', function() {
                    document.querySelectorAll('#teamSelector .setup-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    state.team = this.dataset.team;
                });
            });

            startBtn.addEventListener('click', startGame);
            newBtn.addEventListener('click', resetGame);
            helpBtn.addEventListener('click', showHelp);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'n' || e.key === 'N') { e.preventDefault(); if (gameArea.style.display !== 'none') resetGame(); }
                if (e.key === 'h' || e.key === 'H') { e.preventDefault(); if (gameArea.style.display !== 'none' && state.active) showHelp(); }
                if (e.key === 'Escape') { if (gameArea.style.display !== 'none') resetGame(); }
            });

            console.log('🏀 As parellas - Listo');
        })();
    </script>

</body>
</html>
