<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio · Club Baloncesto O Grove</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="js/config.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/app.js" defer></script>
    
    <script defer>
        document.addEventListener('DOMContentLoaded', function() {
            cargarUltimaNoticia();
        });

        async function cargarUltimaNoticia() {
            const container = document.getElementById('ultimaNoticia');
            if (!container) return;

            try {
                const response = await fetch(CONFIG.sheets.noticias);
                const csv = await response.text();
                const noticias = parseCSVNoticias(csv);

                const validas = noticias.filter(n => n.fecha && n.cabecera);

                if (validas.length === 0) {
                    container.innerHTML = `
                        <div class="fecha">📅 --</div>
                        <h2>🏀 Benvidos á nova web do club</h2>
                        <p>Estamos de estrea! Esta é a nova páxina web do Club Baloncesto O Grove. Aquí poderás atopar toda a información sobre as nosas plantillas, próximos partidos, noticias e moito máis. Agardamos que vos guste!</p>
                    `;
                    return;
                }

                validas.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                const ultima = validas[0];

                container.innerHTML = `
                    <div class="fecha">📅 ${formatearFecha(ultima.fecha)}</div>
                    <h2>${ultima.cabecera}</h2>
                    <p>${ultima.texto_corto || ultima.texto_largo || ''}</p>
                    ${ultima.enlace_imagen ? `<p style="margin-top:0.5rem;"><a href="noticias.html" style="color:var(--dorado); font-weight:600;">📰 Ver todas as novas</a></p>` : ''}
                `;

            } catch (error) {
                console.error('Error cargando la última noticia:', error);
                container.innerHTML = `
                    <div class="fecha">📅 --</div>
                    <h2>🏀 Benvidos á nova web do club</h2>
                    <p>Estamos de estrea! Esta é a nova páxina web do Club Baloncesto O Grove. Aquí poderás atopar toda a información sobre as nosas plantillas, próximos partidos, noticias e moito máis. Agardamos que vos guste!</p>
                `;
            }
        }
    </script>
    
    <style>
        /* ===== HERO ===== */
        .hero {
            background: linear-gradient(135deg, var(--azul-club) 0%, #0d1f33 100%);
            border-radius: 25px;
            padding: 4rem 2rem;
            text-align: center;
            color: var(--blanco);
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
        }
        
        .hero-logo {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }
        
        .hero h1 {
            font-family: var(--font-titulos);
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: var(--dorado);
        }
        
        .hero .eslogan {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }
        
        .hero-acciones {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .hero-acciones a {
            background: var(--dorado);
            color: var(--azul-club);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .hero-acciones a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(201, 160, 61, 0.4);
        }
        
        .hero-acciones a.secundario {
            background: transparent;
            color: var(--blanco);
            border: 2px solid var(--blanco);
        }
        
        .hero-acciones a.secundario:hover {
            background: var(--blanco);
            color: var(--azul-club);
        }

        /* ===== MOSAICO REDES ===== */
        .mosaico-redes {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
            margin-bottom: 3rem;
        }
        
        .mosaico-redes .item {
            background: var(--blanco);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--sombra-suave);
            transition: transform 0.3s, box-shadow 0.3s;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
            text-decoration: none;
            color: inherit;
        }
        
        .mosaico-redes .item:hover {
            transform: translateY(-4px);
            box-shadow: var(--sombra-media);
        }
        
        .mosaico-redes .item-grande {
            grid-row: span 2;
        }
        
        .mosaico-redes .item .icono {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        
        .mosaico-redes .item .nombre {
            font-weight: 600;
            color: var(--azul-club);
        }
        
        .mosaico-redes .item .estado {
            font-size: 0.85rem;
            color: var(--gris-texto);
        }
        
        .mosaico-redes .item.twitch .icono { color: #9146FF; }
        .mosaico-redes .item.youtube .icono { color: #FF0000; }
        .mosaico-redes .item.instagram .icono { color: #E4405F; }
        .mosaico-redes .item.twitter .icono { color: #000000; }

        /* ===== ÚLTIMA NOTICIA ===== */
        .ultima-noticia {
            background: var(--blanco);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: var(--sombra-suave);
            border-left: 5px solid var(--dorado);
            margin-bottom: 3rem;
        }
        
        .ultima-noticia .fecha {
            color: var(--gris-texto);
            font-size: 0.9rem;
        }
        
        .ultima-noticia h2 {
            color: var(--azul-club);
            margin: 0.3rem 0;
            font-family: var(--font-titulos);
        }
        
        .ultima-noticia p {
            color: #444;
            line-height: 1.6;
        }

        /* ===== ACCESOS RÁPIDOS ===== */
        .accesos-rapidos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
        }
        
        .accesos-rapidos a {
            background: var(--blanco);
            padding: 1.5rem 1rem;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            color: var(--azul-club);
            font-weight: 600;
            box-shadow: var(--sombra-suave);
            transition: all 0.3s;
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .accesos-rapidos a:hover {
            transform: translateY(-4px);
            box-shadow: var(--sombra-media);
            background: var(--azul-club);
            color: var(--blanco);
        }
        
        .accesos-rapidos a .emoji {
            display: block;
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }

        .loading-text {
            text-align: center;
            color: var(--gris-texto);
            padding: 0.5rem 0;
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            
            .hero {
                padding: 2rem 1rem;
            }
            
            .mosaico-redes {
                grid-template-columns: 1fr;
            }
            
            .mosaico-redes .item-grande {
                grid-row: span 1;
            }
        }
    </style>
</head>
<body>

    <main class="main-content">
        
        <!-- HERO -->
        <section class="hero">
            <div class="hero-logo">🏀</div>
            <h1>CLUB BALONCESTO O GROVE</h1>
            <p class="eslogan">Orgullo grovense desde 1975</p>
            <div class="hero-acciones">
                <a href="plantillas.html">Ver plantillas</a>
                <a href="jornadas.html" class="secundario">Próximos partidos</a>
            </div>
        </section>

        <!-- MOSAICO DE REDES -->
        <section class="mosaico-redes">
            <a href="https://www.twitch.tv/cbogrove" target="_blank" class="item item-grande twitch">
                <div>
                    <div class="icono"><i class="fab fa-twitch"></i></div>
                    <div class="nombre">Twitch</div>
                    <div class="estado" id="twitchEstadoIndex">🔴 No en directo</div>
                </div>
            </a>
            <a href="https://www.youtube.com/@cbogrove" target="_blank" class="item youtube">
                <div>
                    <div class="icono"><i class="fab fa-youtube"></i></div>
                    <div class="nombre">YouTube</div>
                    <div class="estado">Último video: hace 3 días</div>
                </div>
            </a>
            <a href="https://www.instagram.com/cbogrove" target="_blank" class="item instagram">
                <div>
                    <div class="icono"><i class="fab fa-instagram"></i></div>
                    <div class="nombre">Instagram</div>
                    <div class="estado">@cbogrove</div>
                </div>
            </a>
            <a href="https://x.com/cbogrove" target="_blank" class="item twitter">
                <div>
                    <div class="icono"><i class="fab fa-twitter"></i></div>
                    <div class="nombre">X (Twitter)</div>
                    <div class="estado">@cbogrove</div>
                </div>
            </a>
        </section>

        <!-- ÚLTIMA NOTICIA -->
        <section class="ultima-noticia" id="ultimaNoticia">
            <div class="loading-text">📰 Cargando última nova...</div>
        </section>

        <!-- ACCESOS RÁPIDOS -->
        <section class="accesos-rapidos">
            <a href="plantillas.html">
                <span class="emoji">👥</span>
                Plantillas
            </a>
            <a href="jornadas.html">
                <span class="emoji">📅</span>
                Jornadas
            </a>
            <a href="noticias.html">
                <span class="emoji">📰</span>
                Noticias
            </a>
            <a href="patrocinadores.html">
                <span class="emoji">🏆</span>
                Patrocinadores
            </a>
            <a href="sorteos.html">
                <span class="emoji">🎰</span>
                Sorteos
            </a>
            <a href="xogos.html">
                <span class="emoji">🎮</span>
                Xogos
            </a>
            <a href="contacto.html">
                <span class="emoji">📬</span>
                Contacto
            </a>
        </section>

    </main>

</body>
</html>
