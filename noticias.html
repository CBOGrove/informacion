<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias · Club Baloncesto O Grove</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
    <!-- CSS Global -->
    <link rel="stylesheet" href="/css/style.css">
    
    <!-- JS: Config + Utils + Components + Layout + App -->
    <script src="/js/config.js" defer></script>
    <script src="/js/utils.js" defer></script>
    <script src="/js/components.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/app.js" defer></script>
    
    <!-- Script específico de noticias -->
    <script defer>
        document.addEventListener('DOMContentLoaded', function() {
            cargarNoticias();
        });

        async function cargarNoticias() {
            const destacadaContainer = document.getElementById('noticiaDestacada');
            const gridContainer = document.getElementById('noticiasGrid');

            if (!destacadaContainer || !gridContainer) return;

            try {
                console.log('🔄 Cargando noticias...');
                const response = await fetch(CONFIG.sheets.noticias);
                const csv = await response.text();
                const noticias = parseCSV(csv);

                if (noticias.length === 0) {
                    destacadaContainer.innerHTML = '<p class="no-noticias">Non hai novas dispoñibles.</p>';
                    gridContainer.innerHTML = '';
                    return;
                }

                const validas = noticias.filter(n => n.fecha && n.cabecera);

                if (validas.length === 0) {
                    destacadaContainer.innerHTML = '<p class="no-noticias">Non hai novas dispoñibles.</p>';
                    gridContainer.innerHTML = '';
                    return;
                }

                validas.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

                // Noticia destacada = la más reciente
                const destacada = validas[0];
                destacadaContainer.innerHTML = '';
                destacadaContainer.appendChild(crearTarjetaNoticia(destacada, true));

                // Resto de noticias
                gridContainer.innerHTML = '';
                validas.slice(1).forEach(noticia => {
                    gridContainer.appendChild(crearTarjetaNoticia(noticia, false));
                });

                console.log(`✅ ${validas.length} noticias cargadas`);

            } catch (error) {
                console.error('Error cargando noticias:', error);
                destacadaContainer.innerHTML = '<p class="no-noticias" style="color:#e74c3c;">⚠️ Erro cargando as novas. Reintentando...</p>';
                setTimeout(cargarNoticias, 5000);
            }
        }
    </script>
</head>
<body>

    <main class="main-content">
        <h1 class="page-title">📰 NOVAS DO CLUB</h1>
        <p class="page-subtitle">Mantéñente ao día de todo o que acontece no CB O Grove</p>

        <!-- NOTICIA DESTACADA -->
        <div id="noticiaDestacada" class="noticia-destacada">
            <p class="loading-text">Cargando última nova...</p>
        </div>

        <!-- RESTO DE NOTICIAS -->
        <div class="noticias-grid" id="noticiasGrid">
            <p class="loading-text">Cargando novas...</p>
        </div>
    </main>

</body>
</html>
