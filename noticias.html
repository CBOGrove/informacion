<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias · Club Baloncesto O Grove</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== LISTADO DE NOTICIAS ===== */
        .noticias-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .noticia-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            border-radius: 15px;
            padding: 1.5rem 2rem;
            border-left: 5px solid var(--dorado);
            box-shadow: var(--sombra-suave);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .noticia-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--sombra-media);
        }

        .noticia-card .fecha {
            font-size: 0.85rem;
            color: var(--gris-texto);
            margin-bottom: 0.3rem;
            font-weight: 500;
        }

        .noticia-card .cabecera {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--azul-club);
            font-family: var(--font-titulos);
            margin-bottom: 0.3rem;
        }

        .noticia-card .texto {
            color: #444;
            line-height: 1.6;
        }

        .noticia-card .imagen {
            margin-top: 1rem;
            border-radius: 10px;
            overflow: hidden;
        }

        .noticia-card .imagen img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* ===== NOTICIA DESTACADA (la más reciente) ===== */
        .noticia-destacada {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2.5rem;
            border: 2px solid var(--dorado);
            box-shadow: var(--sombra-media);
        }

        .noticia-destacada .fecha {
            font-size: 0.9rem;
            color: var(--gris-texto);
            margin-bottom: 0.3rem;
        }

        .noticia-destacada .cabecera {
            font-size: 2rem;
            font-weight: 700;
            color: var(--azul-club);
            font-family: var(--font-titulos);
            margin-bottom: 0.5rem;
        }

        .noticia-destacada .texto {
            font-size: 1.1rem;
            color: #444;
            line-height: 1.7;
        }

        .noticia-destacada .imagen {
            margin-top: 1rem;
            border-radius: 12px;
            overflow: hidden;
        }

        .noticia-destacada .imagen img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
        }

        /* ===== TÍTULO DE PÁGINA ===== */
        .page-title {
            text-align: center;
            color: var(--azul-club);
            font-family: var(--font-titulos);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.8);
        }
        .page-subtitle {
            text-align: center;
            color: var(--gris-texto);
            margin-bottom: 2rem;
        }

        .loading-text {
            text-align: center;
            color: var(--gris-texto);
            padding: 2rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .noticia-destacada .cabecera {
                font-size: 1.5rem;
            }
            .noticia-destacada .texto {
                font-size: 1rem;
            }
            .noticia-card {
                padding: 1rem 1.2rem;
            }
            .noticia-card .cabecera {
                font-size: 1.1rem;
            }
            .noticia-destacada {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="main-header">
        <a href="/" class="logo">
            <img src="assets/img/logos/club/logo-dorado.png" alt="CB O Grove" onerror="this.style.display='none'">
            CB O GROVE
        </a>
        <nav class="main-nav">
            <a href="/">Inicio</a>
            <a href="plantillas.html">Plantillas</a>
            <a href="jornadas.html">Jornadas</a>
            <a href="noticias.html" class="active">Noticias</a>
            <a href="sorteos.html">Sorteos</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <span class="twitch-badge" id="twitchBadge">📺 No en directo</span>
    </header>

    <!-- ===== CONTENIDO ===== -->
    <main class="main-content">
        <h1 class="page-title">📰 NOVAS DO CLUB</h1>
        <p class="page-subtitle">Mantéñente ao día de todo o que acontece no CB O Grove</p>

        <!-- NOTICIA DESTACADA (la más reciente) -->
        <div id="noticiaDestacada" class="noticia-destacada">
            <p class="loading-text">Cargando última nova...</p>
        </div>

        <!-- RESTO DE NOTICIAS -->
        <div class="noticias-grid" id="noticiasGrid">
            <p class="loading-text">Cargando novas...</p>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer">
        <div class="redes">
            <a href="https://www.tiktok.com/@cbogrove" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@cbogrove" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.instagram.com/cbogrove" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.twitch.tv/cbogrove" target="_blank"><i class="fab fa-twitch"></i></a>
            <a href="https://x.com/cbogrove" target="_blank"><i class="fab fa-twitter"></i></a>
        </div>
        <div class="copy">© 2026 Club Baloncesto O Grove</div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        // ===== CONFIGURACIÓN =====
        const CONFIG_NOTICIAS = {
            sheetUrl: 'https://docs.google.com/spreadsheets/d/1WyAXYg7YZXG3jhr2y1LjgoRMbq7nWtHReJmBTk-FkcQ/export?format=csv'
        };

        // ===== FUNCIONES =====
        function parseCSV(csv) {
            const lines = csv.split('\n').filter(line => line.trim());
            if (lines.length < 2) return [];

            const rawHeaders = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            const headerMap = {};
            rawHeaders.forEach((h, index) => {
                if (h.includes('fecha')) headerMap['fecha'] = index;
                else if (h.includes('cabecera') || h.includes('titulo')) headerMap['cabecera'] = index;
                else if (h.includes('texto') || h.includes('descripcion')) headerMap['texto'] = index;
                else if (h.includes('imagen') || h.includes('enlace') || h.includes('foto')) headerMap['enlace_imagen'] = index;
            });

            if (headerMap['fecha'] === undefined) headerMap['fecha'] = 0;
            if (headerMap['cabecera'] === undefined) headerMap['cabecera'] = 1;
            if (headerMap['texto'] === undefined) headerMap['texto'] = 2;
            if (headerMap['enlace_imagen'] === undefined) headerMap['enlace_imagen'] = 3;

            return lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                const obj = {};
                Object.keys(headerMap).forEach(key => {
                    let value = values[headerMap[key]] || '';
                    // Limpiar comillas que Google Sheets añade automáticamente
                    if (value.startsWith('"') && value.endsWith('"')) {
                        value = value.slice(1, -1);
                    }
                    obj[key] = value;
                });
                return obj;
            });
        }

        function formatearFecha(fecha) {
            if (!fecha) return '';
            const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(fecha).toLocaleDateString('gl-ES', opciones);
        }

        function crearNoticia(noticia, destacada = false) {
            const container = document.createElement('div');
            container.className = destacada ? 'noticia-destacada' : 'noticia-card';

            let html = `
                <div class="fecha">📅 ${formatearFecha(noticia.fecha)}</div>
                <div class="cabecera">${noticia.cabecera || 'Sen título'}</div>
                <div class="texto">${noticia.texto || ''}</div>
            `;

            // Si hay imagen, mostrarla
            if (noticia.enlace_imagen && noticia.enlace_imagen.length > 0) {
                html += `
                    <div class="imagen">
                        <img src="${noticia.enlace_imagen}" alt="${noticia.cabecera || 'Imaxe'}" loading="lazy" onerror="this.style.display='none'">
                    </div>
                `;
            }

            container.innerHTML = html;
            return container;
        }

        async function cargarNoticias() {
            const destacadaContainer = document.getElementById('noticiaDestacada');
            const gridContainer = document.getElementById('noticiasGrid');

            try {
                console.log('🔄 Cargando noticias desde:', CONFIG_NOTICIAS.sheetUrl);
                const response = await fetch(CONFIG_NOTICIAS.sheetUrl);
                const csv = await response.text();
                console.log('📄 CSV recibido (primeros 200 caracteres):', csv.substring(0, 200));
                
                const noticias = parseCSV(csv);
                console.log('📊 Noticias parseadas:', noticias);

                if (noticias.length === 0) {
                    destacadaContainer.innerHTML = '<p style="text-align:center; color:var(--gris-texto);">Non hai novas dispoñibles.</p>';
                    gridContainer.innerHTML = '';
                    return;
                }

                // Filtrar noticias que tengan al menos fecha y cabecera
                const validas = noticias.filter(n => n.fecha && n.cabecera);

                if (validas.length === 0) {
                    destacadaContainer.innerHTML = '<p style="text-align:center; color:var(--gris-texto);">Non hai novas dispoñibles.</p>';
                    gridContainer.innerHTML = '';
                    return;
                }

                // Ordenar por fecha (más reciente primero)
                validas.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

                // Primera noticia = destacada
                const destacada = validas[0];
                destacadaContainer.innerHTML = '';
                destacadaContainer.appendChild(crearNoticia(destacada, true));

                // Resto de noticias
                gridContainer.innerHTML = '';
                validas.slice(1).forEach(noticia => {
                    gridContainer.appendChild(crearNoticia(noticia, false));
                });

                console.log(`✅ Noticias cargadas: ${validas.length} (1 destacada + ${validas.length - 1} no listado)`);

            } catch (error) {
                console.error('Error cargando noticias:', error);
                destacadaContainer.innerHTML = '<p style="text-align:center; color:#e74c3c;">⚠️ Erro cargando as novas. Reintentando...</p>';
                setTimeout(cargarNoticias, 5000);
            }
        }

        document.addEventListener('DOMContentLoaded', cargarNoticias);
    </script>
</body>
</html>
