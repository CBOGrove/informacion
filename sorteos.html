<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteos · Club Baloncesto O Grove</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== CONTENEDOR DE SORTEOS ===== */
        .sorteos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== TARJETA DE SORTEO ===== */
        .sorteo-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            border-left: 5px solid var(--dorado);
            box-shadow: var(--sombra-suave);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sorteo-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--sombra-media);
        }

        /* ===== TARJETA INACTIVA (gris apagado) ===== */
        .sorteo-card.inactivo {
            opacity: 0.6;
            filter: grayscale(0.4);
            border-left-color: #999;
        }

        .sorteo-card.inactivo .ganadores a {
            pointer-events: auto;
            color: var(--dorado);
            text-decoration: underline;
        }

        .sorteo-card.inactivo .ganadores a:hover {
            color: var(--azul-club);
        }

        .sorteo-card.inactivo .btn-participar {
            background: #999;
            cursor: not-allowed;
            pointer-events: none;
        }

        .sorteo-card.inactivo .btn-participar:hover {
            background: #999;
            transform: none;
        }

        /* ===== ICONO ===== */
        .sorteo-card .icono {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sorteo-card .icono img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .sorteo-card .titulo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--azul-club);
            font-family: var(--font-titulos);
            margin-bottom: 0.3rem;
        }

        .sorteo-card .descricion {
            color: var(--gris-texto);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.2rem;
            flex: 1;
        }

        .sorteo-card .btn-participar {
            background: var(--azul-club);
            color: white;
            padding: 0.6rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.3s, transform 0.2s;
            display: inline-block;
        }

        .sorteo-card .btn-participar:hover {
            background: var(--dorado);
            color: var(--azul-club);
            transform: translateY(-2px);
        }

        .sorteo-card .estado {
            font-size: 0.8rem;
            color: var(--gris-texto);
            margin-top: 0.5rem;
            opacity: 0.7;
        }

        .sorteo-card .ganadores {
            font-size: 0.85rem;
            color: var(--azul-club);
            margin-top: 0.5rem;
            font-weight: 500;
            line-height: 1.6;
        }

        .sorteo-card .ganadores a {
            color: var(--dorado);
            text-decoration: none;
            font-weight: 600;
            pointer-events: auto;
        }

        .sorteo-card .ganadores a:hover {
            text-decoration: underline;
            color: var(--azul-club);
        }

        /* ===== BOTÓN BASES LEGAIS ===== */
        .bases-legais-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--azul-club);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(30, 58, 95, 0.4);
            transition: all 0.3s;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 2px solid var(--dorado);
        }

        .bases-legais-btn:hover {
            background: var(--dorado);
            color: var(--azul-club);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(201, 160, 61, 0.4);
        }

        /* ===== TÍTULOS ===== */
        .page-title {
            text-align: center;
            color: var(--azul-club);
            font-family: var(--font-titulos);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.8);
        }
        .page-subtitle {
            text-align: center;
            color: var(--gris-texto);
            margin-bottom: 2.5rem;
        }

        /* ===== SPINNER ===== */
        .spinner-container {
            text-align: center;
            padding: 3rem 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(201, 160, 61, 0.1);
            border-top: 5px solid var(--dorado);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-sorteos {
            text-align: center;
            color: var(--gris-texto);
            padding: 2rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sorteos-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .sorteo-card {
                padding: 1.5rem 1rem;
            }
            .sorteo-card .icono {
                font-size: 2.8rem;
                width: 60px;
                height: 60px;
            }
            .sorteo-card .titulo {
                font-size: 1.2rem;
            }
            .page-title {
                font-size: 1.8rem;
            }
            
            .bases-legais-btn {
                bottom: 20px;
                right: 20px;
                padding: 0.6rem 1.2rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .bases-legais-btn {
                bottom: 15px;
                right: 15px;
                padding: 0.5rem 1rem;
                font-size: 0.7rem;
            }
            .bases-legais-btn i {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main class="main-content">
        <h1 class="page-title">🎰 SORTEOS</h1>
        <p class="page-subtitle">Participa nos nosos sorteos e gaña premios exclusivos</p>

        <div class="sorteos-grid" id="sorteosGrid">
            <div class="spinner-container">
                <div class="spinner"></div>
                <p style="color: var(--gris-texto);">Cargando sorteos...</p>
            </div>
        </div>
    </main>

    <!-- ===== BOTÓN BASES LEGAIS ===== -->
    <a href="https://cbogrove.github.io/Bases_legais/" target="_blank" class="bases-legais-btn">
        <i class="fas fa-file-alt"></i>
        Bases legais
    </a>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/app.js"></script>
    <script src="js/layout.js"></script>
    <script>
        // ===== CONFIGURACIÓN =====
        const CONFIG_SORTEOS = {
            sheetUrl: 'https://docs.google.com/spreadsheets/d/1we-1DRNJjbrut1lzJZFwBwxSWCcGrRZ1D4Afb4QYIyY/export?format=csv'
        };

        // ===== FUNCIÓN PARA LIMPIAR TEXTO =====
        function limpiarTexto(texto) {
            if (!texto) return '';
            texto = texto.replace(/^["']+|["']+$/g, '');
            texto = texto.replace(/\n/g, ' ').replace(/\r/g, ' ');
            texto = texto.replace(/\s+/g, ' ');
            return texto.trim();
        }

        // ===== PARSE CSV MEJORADO (por NOMBRE de columna) =====
        function parseCSV(csv) {
            const lines = csv.split('\n').filter(line => line.trim());
            if (lines.length < 2) return [];

            // Obtener headers
            const rawHeaders = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            // Mapear índices por nombre
            const headerMap = {};
            rawHeaders.forEach((h, index) => {
                const lower = h.toLowerCase().trim();
                if (lower.includes('icono') || lower.includes('icon')) headerMap['icono'] = index;
                else if (lower.includes('titulo') || lower.includes('título') || lower.includes('nombre')) headerMap['titulo'] = index;
                else if (lower.includes('explicacion') || lower.includes('descripcion') || lower.includes('descripción')) headerMap['explicacion'] = index;
                else if (lower.includes('enlace') || lower.includes('url') || lower.includes('link')) headerMap['enlace'] = index;
                else if (lower.includes('inicio') || lower.includes('fechainicio')) headerMap['inicio'] = index;
                else if (lower.includes('fin') || lower.includes('fechafin')) headerMap['fin'] = index;
                else if (lower.includes('activo') || lower.includes('actiu')) headerMap['activo'] = index;
                else if (lower.includes('ganador') || lower.includes('gañador')) headerMap['ganador'] = index;
            });

            // Asignar índices por defecto si no se encontraron
            if (headerMap['icono'] === undefined) headerMap['icono'] = 0;
            if (headerMap['titulo'] === undefined) headerMap['titulo'] = 1;
            if (headerMap['explicacion'] === undefined) headerMap['explicacion'] = 2;
            if (headerMap['enlace'] === undefined) headerMap['enlace'] = 3;
            if (headerMap['inicio'] === undefined) headerMap['inicio'] = 4;
            if (headerMap['fin'] === undefined) headerMap['fin'] = 5;
            if (headerMap['activo'] === undefined) headerMap['activo'] = 6;
            if (headerMap['ganador'] === undefined) headerMap['ganador'] = 7;

            return lines.slice(1).map(line => {
                const values = parseCSVLine(line);
                const obj = {};
                Object.keys(headerMap).forEach(key => {
                    let value = values[headerMap[key]] || '';
                    value = limpiarTexto(value);
                    obj[key] = value;
                });
                return obj;
            });
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                    continue;
                }
                if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                    continue;
                }
                current += char;
            }
            if (current.trim() || result.length > 0) {
                result.push(current.trim());
            }
            return result;
        }

        function formatearFecha(fecha) {
            if (!fecha) return '';
            try {
                const opciones = { day: '2-digit', month: '2-digit', year: 'numeric' };
                return new Date(fecha).toLocaleDateString('gl-ES', opciones);
            } catch (e) {
                return fecha;
            }
        }

        function esActivo(valor) {
            if (!valor) return false;
            return valor.toUpperCase().trim() === 'SI';
        }

        function esImagenURL(texto) {
            if (!texto) return false;
            return texto.startsWith('http://') || texto.startsWith('https://') || texto.startsWith('data:image');
        }

        /**
         * Parsea el texto de ganadores con formato:
         * - "Kampa" → texto plano
         * - "[Instagram](https://...)" → enlace con texto "Instagram"
         * - "Camiseta: Kampa | Balón: Jose" → múltiples ganadores
         */
        function parsearGanadores(texto) {
            if (!texto || texto.trim() === '') return null;

            // Si tiene | separa múltiples ganadores
            if (texto.includes('|')) {
                const partes = texto.split('|').map(p => p.trim());
                return partes.map(p => parsearGanadorIndividual(p)).filter(g => g !== null);
            }

            return parsearGanadorIndividual(texto);
        }

        function parsearGanadorIndividual(texto) {
            // Busca enlaces con formato [texto](url)
            const enlaceRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
            let match;
            let resultado = [];
            let ultimoIndex = 0;

            while ((match = enlaceRegex.exec(texto)) !== null) {
                if (match.index > ultimoIndex) {
                    const textoAntes = texto.substring(ultimoIndex, match.index).trim();
                    if (textoAntes) {
                        resultado.push({ texto: textoAntes, url: null });
                    }
                }
                resultado.push({ texto: match[1], url: match[2] });
                ultimoIndex = enlaceRegex.lastIndex;
            }

            if (ultimoIndex < texto.length) {
                const textoRestante = texto.substring(ultimoIndex).trim();
                if (textoRestante) {
                    resultado.push({ texto: textoRestante, url: null });
                }
            }

            if (resultado.length === 0) {
                return { texto: texto.trim(), url: null };
            }

            return resultado;
        }

        function renderizarGanadores(ganadoresData) {
            if (!ganadoresData) return '';

            if (Array.isArray(ganadoresData)) {
                return ganadoresData.map(g => renderizarGanador(g)).join('<br>');
            }

            return renderizarGanador(ganadoresData);
        }

        function renderizarGanador(ganador) {
            if (Array.isArray(ganador)) {
                return ganador.map(part => {
                    if (part.url) {
                        return `<a href="${part.url}" target="_blank" rel="noopener">${part.texto}</a>`;
                    }
                    return part.texto;
                }).join(' ');
            }

            if (ganador.url) {
                return `<a href="${ganador.url}" target="_blank" rel="noopener">${ganador.texto}</a>`;
            }
            return ganador.texto;
        }

        function crearSorteo(sorteo) {
            const container = document.createElement('div');
            
            const activo = esActivo(sorteo.activo);
            container.className = `sorteo-card${!activo ? ' inactivo' : ''}`;

            // Icono
            let iconoHTML = '';
            if (sorteo.icono) {
                if (esImagenURL(sorteo.icono)) {
                    iconoHTML = `<img src="${sorteo.icono}" alt="${sorteo.titulo}">`;
                } else {
                    iconoHTML = sorteo.icono;
                }
            }

            // Estado
            let estadoHTML = '';
            if (sorteo.ganador) {
                const ganadoresParsed = parsearGanadores(sorteo.ganador);
                const ganadoresHTML = renderizarGanadores(ganadoresParsed);
                estadoHTML = `<div class="ganadores">🏆 Gañador: ${ganadoresHTML}</div>`;
            } else if (sorteo.fin) {
                estadoHTML = `<div class="estado">📅 Remata o ${formatearFecha(sorteo.fin)}</div>`;
            }

            // Botón
            let botonHTML = '';
            if (activo && sorteo.enlace) {
                botonHTML = `<a href="${sorteo.enlace}" target="_blank" class="btn-participar">▶ Participar</a>`;
            } else if (!activo) {
                botonHTML = `<span class="btn-participar" style="background:#999;cursor:not-allowed;">🔒 Finalizado</span>`;
            }

            container.innerHTML = `
                <div class="icono">${iconoHTML}</div>
                <div class="titulo">${sorteo.titulo || 'Sen título'}</div>
                <div class="descricion">${sorteo.explicacion || ''}</div>
                ${botonHTML}
                ${estadoHTML}
            `;

            return container;
        }

        async function cargarSorteos() {
            const grid = document.getElementById('sorteosGrid');

            try {
                console.log('🔄 Cargando sorteos...');
                const response = await fetch(CONFIG_SORTEOS.sheetUrl);
                const csv = await response.text();
                console.log('📄 CSV recibido');
                
                const sorteos = parseCSV(csv);
                console.log('📊 Sorteos parseados:', sorteos);

                grid.innerHTML = '';

                const activos = sorteos.filter(s => esActivo(s.activo));
                const inactivos = sorteos.filter(s => !esActivo(s.activo));
                const ordenados = [...activos, ...inactivos];

                if (ordenados.length === 0) {
                    grid.innerHTML = `<p class="no-sorteos">Non hai sorteos dispoñibles neste momento.</p>`;
                    return;
                }

                ordenados.forEach(s => {
                    grid.appendChild(crearSorteo(s));
                });

                console.log(`✅ ${ordenados.length} sorteos cargados`);

            } catch (error) {
                console.error('Error:', error);
                grid.innerHTML = `
                    <div class="no-sorteos" style="color:#e74c3c;">
                        ⚠️ Erro cargando os sorteos.
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarSorteos);
    </script>
</body>
</html>
